version: '3.8'

networks:
  davis-net:
    driver: bridge

services:
  redis:
    image: redis:7.0
    container_name: davis-redis
    restart: always
    ports:
      - "6379:6379"  # 必须暴露端口，本地才能连接
    networks:
      - davis-net
    volumes:
      - ./data/redis:/data
    # 警告：务必将下面的密码替换为大小写+数字+特殊字符的强密码！
    command: redis-server --appendonly yes --requirepass "Davis_Redis_Str0ngPass!2026"
    deploy:
      resources:
        limits:
          memory: 512M

  mysql:
    image: mysql:8.0
    container_name: davis-mysql
    restart: always
    ports:
      - "3306:3306"  # 必须暴露端口，本地才能连接
    environment:
      # 警告：务必将 123456 替换为强密码！
      MYSQL_ROOT_PASSWORD: "Davis_MySQL_R00t_Pass!"
      MYSQL_DATABASE: davis-backend
      MYSQL_USER: davis
      MYSQL_PASSWORD: "Davis_App_Pass!2026"
    volumes:
      - ./data/mysql:/var/lib/mysql
    networks:
      - davis-net
    deploy:
      resources:
        limits:
          memory: 1024M

  # 预留你的后端应用服务位置 (配合你的 GitHub Actions CI/CD)
  web:
    # 你的专属镜像地址（已全部小写）
    image: davis-backend:latest
    container_name: davis-backend-api
    restart: always
    ports:
      - "8080:8080"  # 假设你的代码应用跑在 8080 端口，对外网暴露 80 端口
    depends_on:
      - mysql
      - redis
    networks:
      - davis-net
    volumes:
      # 持久化上传文件，防止容器重建后丢失（头像、附件、导入模板等）
      - ./data/upload:/app/uploadPath
    environment:
      # 告诉你的代码如何连接数据库和 Redis
      - DB_HOST=davis-mysql
      - REDIS_HOST=davis-redis
      # 请确保这里的密码和你上面的 mysql 服务配置保持一致！
      - DB_PASSWORD=Davis_MySQL_R00t_Pass!
    deploy:
      resources:
        limits:
          memory: 1536M  # 保护你 4G 服务器不宕机的最后防线