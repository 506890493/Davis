name: Build and Deploy Spring Boot

# 触发条件：当代码推送到 main 分支时执行
on:
#  push:
#    branches: [ "main" ] # 如果你的主分支叫 master，请改成 master
  workflow_dispatch

env:
  REGISTRY: ghcr.io
  # 强烈注意：镜像名称必须全部小写！
  IMAGE_NAME: 506890493/davis

jobs:
  # 任务 1：编译代码、构建镜像并推送到仓库
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # GitHub 自动生成的 Token

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          # 开启 GitHub Actions 的专属构建缓存
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 任务 2：登录服务器并部署最新镜像
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # 核心修复：将默认的 10 分钟超时延长到 30 分钟
          command_timeout: 30m
          script: |
            
            # 2. 进入你在服务器上的部署目录
            cd /opt/myapp
            
            # 3. 只拉取 web 服务的最新镜像
            docker compose pull web
            
            # 4. 只重启 web 服务，不中断 MySQL 和 Redis
            docker compose up -d --no-deps web
            
            # 5. 清理旧镜像，释放磁盘空间
            docker image prune -f