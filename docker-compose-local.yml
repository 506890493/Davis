version: '3.8'

networks:
  redis-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

services:
  redis-1:
    image: redis:7.0
    container_name: redis-1
    restart: always
    ports:
      - "7001:6379"
      - "17001:16379"
    networks:
      redis-net:
        ipv4_address: 172.20.0.11
    volumes:
      - ./data/7001:/data
    # 关键修改：cluster-announce-ip 必须是节点在网络中能被其他节点访问的 IP
    command: >
      redis-server  --cluster-enabled yes  --cluster-config-file nodes.conf  --cluster-node-timeout 5000  --appendonly yes  --cluster-announce-ip 172.20.0.11 --cluster-announce-port 6379 --cluster-announce-bus-port 16379

  redis-2:
    image: redis:7.0
    container_name: redis-2
    restart: always
    ports:
      - "7002:6379"
      - "17002:16379"
