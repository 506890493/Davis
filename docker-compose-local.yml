  # 启动一个MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: davis-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: davis-backend
      MYSQL_USER: davis
      MYSQL_PASSWORD: davis123
    volumes:
      - ./data/mysql:/var/lib/mysql
    networks:
      redis-net:
        ipv4_address: 172.20.0.20


